<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黑洞时刻 · Blackhole Moments</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #141926; --line: #232a3d;
    --text: #e8ecf5; --muted: #97a0b5; --accent: #ffb347; --accent2: #6ad0ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 80% -10%, #1a2236 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    min-height: 100vh; line-height: 1.6;
  }
  header { max-width: 1040px; margin: 0 auto; padding: 72px 24px 28px; }
  h1 { font-size: clamp(32px, 5vw, 52px); letter-spacing: 1px; }
  h1 .dot { color: var(--accent); }
  .sub { color: var(--muted); margin-top: 12px; font-size: 18px; }
  .count {
    display: inline-block; margin-top: 20px; padding: 6px 14px;
    border: 1px solid var(--line); border-radius: 999px;
    color: var(--accent2); font-size: 14px; background: var(--panel);
  }
  main {
    max-width: 1040px; margin: 0 auto; padding: 16px 24px 64px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .card {
    display: flex; flex-direction: column; gap: 10px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 22px; text-decoration: none; color: var(--text);
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .card:hover {
    transform: translateY(-4px); border-color: var(--accent);
    box-shadow: 0 12px 32px rgba(0,0,0,.45);
  }
  .chip {
    align-self: flex-start; font-size: 12px; color: #0b0e14;
    background: var(--accent); border-radius: 999px; padding: 3px 10px; font-weight: 600;
  }
  .card h2 { font-size: 20px; }
  .sentence { color: var(--accent2); font-style: italic; font-size: 15px; }
  .summary { color: var(--muted); font-size: 14px; flex: 1; }
  .go { color: var(--accent); font-size: 14px; font-weight: 600; }
  .empty { color: var(--muted); }
  footer {
    max-width: 1040px; margin: 0 auto; padding: 0 24px 48px;
    color: var(--muted); font-size: 13px;
  }
</style>
</head>
<body>
  <header>
    <h1>黑洞时刻<span class="dot">.</span></h1>
    <p class="sub">每一个语法点背后，都藏着一个让你 &ldquo;哇&rdquo; 的世界。</p>
    <span class="count">共 1 个黑洞</span>
  </header>
  <main>
      <a class="card" href="neuroplasticity.html">
        
        <h2>练习，真的会改变大脑 · Practice makes perfect</h2>
        
        
        <span class="go">进入黑洞 &rarr;</span>
      </a>
  </main>
  <footer>索引更新于 2026-10-05 · 课堂兴趣拓展素材</footer>
</body>
</html>
